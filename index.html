  /* ==========================================================
     风格：暗色极光 · 霓虹渐变（对齐 xkkgame 的视觉语言）
     ========================================================== */
  :root{
    --bg:#07080f;
    --bg-soft:#0a0c18;
    --card:rgba(10,12,24,.60);
    --card-hover:rgba(18,22,44,.72);
    --line:rgba(255,255,255,.08);
    --txt:#eef0ff;
    --sub:#8b90b5;
    --cyan:#22d3ee;
    --violet:#a78bfa;
    --pink:#f472b6;
    --grad-logo:linear-gradient(92deg,#5eead4,#22d3ee 30%,#a78bfa 65%,#f472b6);
    --grad-bar:linear-gradient(180deg,var(--cyan),var(--violet),var(--pink));
    --grad-btn:linear-gradient(135deg,#0891b2,#7c3aed);
    --shadow-card:0 10px 32px rgba(20,10,60,.5), 0 0 0 1px rgba(34,211,238,.12);
    --grain-dot:rgba(255,255,255,.028);
    --veil-1:rgba(7,8,15,.28);
    --veil-2:rgba(7,8,15,.42);
    --veil-3:rgba(7,8,15,.60);
    --aura-1:rgba(120,80,255,.18);
    --aura-2:rgba(34,211,238,.10);
  }

  /* 亮色：淡紫灰顶 + 紫色波浪过渡（对齐 link3.cc 背景） */
  :root[data-theme="light"]{
    --bg:#7c36ea;
    --bg-soft:#ffffff;
    --card:#ffffff;
    --card-hover:#ffffff;
    --line:rgba(255,255,255,0);
    --txt:#171327;
    --sub:#6a5f8c;

    --shadow-card:0 14px 34px rgba(45,16,110,.22),0 2px 6px rgba(45,16,110,.10);
    --grain-dot:rgba(40,30,90,.035);
    --veil-1:rgba(244,242,251,.30);
    --veil-2:rgba(244,242,251,.45);
    --veil-3:rgba(244,242,251,.62);
    --aura-1:rgba(140,110,255,.16);
    --aura-2:rgba(34,211,238,.12);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--txt);min-height:100vh;
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
    transition:background-color .35s ease,color .35s ease;
  }

  /* ===== 极光背景 ===== */
  .aurora{
    position:fixed;inset:0;z-index:-3;overflow:hidden;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%,var(--aura-1),transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 110%,var(--aura-2),transparent 60%),
      var(--bg);
  }
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 16s ease-in-out infinite}
  .b1{width:420px;height:420px;background:#5b3df5;top:-140px;left:-100px}
  .b2{width:360px;height:360px;background:#0ea5e9;top:30%;right:-140px;animation-delay:-5s;animation-duration:20s}
  .b3{width:300px;height:300px;background:#d946ef;bottom:-120px;left:30%;animation-delay:-9s;animation-duration:24s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.94)}}

  .veil{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,var(--veil-1),var(--veil-2) 55%,var(--veil-3))}

  .grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9;
    background-image:radial-gradient(var(--grain-dot) 1px,transparent 1px);background-size:26px 26px}

  /* ===== 方案1（暗色）：顶部光源 + 细网格 + 颗粒加强 ===== */
  :root[data-theme="dark"] .aurora::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 72% 40% at 50% -8%,rgba(255,255,255,.075),transparent 62%)}
  :root[data-theme="dark"] .aurora::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/32px 32px,
      linear-gradient(180deg,rgba(255,255,255,.022) 1px,transparent 1px) 0 0/32px 32px;
    -webkit-mask-image:radial-gradient(ellipse 82% 62% at 50% 32%,#000 18%,transparent 78%);

  :root[data-theme="dark"] .grain{background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px)}

  :root[data-theme="light"] .waves{display:block}
  :root[data-theme="light"] .aurora{background:transparent}
  :root[data-theme="light"] .blob{display:none}
  :root[data-theme="light"] .veil{background:none}

  .wrap{max-width:820px;margin:0 auto;padding:0 18px 80px;position:relative;z-index:1}

  /* ===== 顶部 ===== */
  header{padding:52px 0 10px;text-align:center}

  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#9be9f7;
    background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);
    padding:5px 14px;border-radius:99px;margin-bottom:16px;letter-spacing:1px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .badge i{width:7px;height:7px;border-radius:50%;background:#34d399;
    box-shadow:0 0 8px #34d399;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  :root[data-theme="light"] .badge{color:#6d4de0;background:rgba(124,58,237,.09);border-color:rgba(124,58,237,.24)}
  :root[data-theme="light"] .badge i{background:#a855f7;box-shadow:0 0 8px #a855f7}

  h1{font-size:34px;font-weight:800;letter-spacing:2px;
    background:var(--grad-logo);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(140,110,255,.35));
    display:flex;align-items:center;justify-content:center;gap:10px}

  .hico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
    font-size:21px;font-weight:800;color:#fff;letter-spacing:0;
    background:linear-gradient(135deg,#0891b2,#7c3aed);
    box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 2px rgba(140,120,255,.35);
    transition:transform .3s}
  h1:hover .hico{transform:rotate(-8deg) scale(1.08)}

  .sub{color:#aab0d6;font-size:14px;margin-top:10px;text-shadow:0 1px 8px rgba(0,0,0,.6);line-height:1.9}
  :root[data-theme="light"] .sub{color:#4d4270;text-shadow:none}

  .meta{display:flex;justify-content:center;align-items:center;gap:10px;margin:16px 0 28px}
  .chip{font-size:12px;color:#a9aed4;background:rgba(10,12,24,.5);border:1px solid var(--line);
    padding:4px 13px;border-radius:99px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  :root[data-theme="light"] .chip{background:rgba(255,255,255,.82);color:#5b4b85;border-color:rgba(255,255,255,.60)}
  :root[data-theme="light"] h1{filter:drop-shadow(0 4px 18px rgba(124,58,237,.18))}
  :root[data-theme="light"] .hico{background:linear-gradient(135deg,#7c3aed,#db2777);
    box-shadow:0 6px 18px rgba(124,58,237,.35),0 0 0 3px rgba(255,255,255,.55)}

  /* ===== 卡片列表 ===== */
  #list{display:grid;grid-template-columns:1fr;gap:14px;max-width:560px;margin:0 auto}
  .item{
    position:relative;display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;text-decoration:none;color:var(--txt);overflow:hidden;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:transform .22s cubic-bezier(.2,.8,.3,1.2),border-color .2s,background .2s,box-shadow .25s;
    animation:up .5s both;
  }
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--grad-bar);opacity:0;transition:opacity .2s}
  .item:hover,.item:focus-visible{
    transform:translateY(-3px);border-color:rgba(34,211,238,.45);background:var(--card-hover);
    box-shadow:var(--shadow-card);outline:none}
  .item:hover::before,.item:focus-visible::before{opacity:1}
  :root[data-theme="light"] .item{border-radius:24px;border-color:transparent;
    box-shadow:0 8px 22px rgba(45,16,110,.16),0 1px 3px rgba(45,16,110,.10)}
  :root[data-theme="light"] .item:hover,:root[data-theme="light"] .item:focus-visible{
    border-color:transparent;box-shadow:0 18px 40px rgba(45,16,110,.28),0 3px 8px rgba(45,16,110,.14)}

  /* ===== 方案2（暗色）：玻璃卡 ===== */
  :root[data-theme="dark"] .item{
    background:linear-gradient(180deg,rgba(255,255,255,.070),rgba(255,255,255,.026));
    border-color:rgba(255,255,255,.11);
    backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.42)}
  :root[data-theme="dark"] .item:hover,:root[data-theme="dark"] .item:focus-visible{
    border-color:rgba(34,211,238,.45);
    background:linear-gradient(180deg,rgba(255,255,255,.105),rgba(255,255,255,.048));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 44px rgba(0,0,0,.52),0 0 26px rgba(34,211,238,.10)}

  /* ===== 分组标题（对齐 link3 的「资源合集 / 资源频道」小标题）===== */
  .sec{display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:15px;font-weight:700;letter-spacing:1.5px;color:#fff;
    margin:12px 0 2px;text-shadow:0 2px 12px rgba(40,10,90,.35)}
  .sec svg{width:15px;height:15px;opacity:.9;animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
  :root[data-theme="dark"] .sec{color:#c9cef0;text-shadow:none}

  /* ===== 第一个方框：轻微摇动（复刻 link3 的 .shake_button）===== */
  .shakewrap{display:block;animation:shakeBox 3s linear infinite}
  @keyframes shakeBox{
    0%{transform:translateX(3px) rotate(1deg)}
    2.5%{transform:translateX(-3px) rotate(-1deg)}
    5%{transform:translateX(3px) rotate(1deg)}
    7.5%{transform:translateX(-3px) rotate(-1deg)}
    10%{transform:translateX(2px) rotate(1deg)}
    12.5%{transform:translateX(-2px) rotate(-1deg)}
    15%{transform:translateX(2px) rotate(1deg)}
    17.5%{transform:translateX(-2px) rotate(-1deg)}
    20%{transform:translateX(1px) rotate(1deg)}
    22.5%{transform:translateX(-1px) rotate(-1deg)}
    25%{transform:translateX(0) rotate(0)}
  }
  @media (prefers-reduced-motion: reduce){
    .shakewrap,.sec svg{animation:none}
  }

  .ava{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
    color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .25s}
  .ava svg{width:22px;height:22px}
  .item:hover .ava{transform:scale(1.06) rotate(-4deg)}
  .g0{background:linear-gradient(135deg,#0891b2,#7c3aed)}
  .g1{background:linear-gradient(135deg,#db2777,#7c3aed)}
  .g2{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
  .g3{background:linear-gradient(135deg,#d97706,#db2777)}
  :root[data-theme="light"] .g0{background:linear-gradient(135deg,#7c3aed,#c026d3)}
  :root[data-theme="light"] .g1{background:linear-gradient(135deg,#db2777,#a855f7)}
  :root[data-theme="light"] .g2{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
  :root[data-theme="light"] .g3{background:linear-gradient(135deg,#c026d3,#f472b6)}

  .info{flex:1;min-width:0}
  .trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .title{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .title.long{white-space:normal;overflow:visible;line-height:1.35;display:block}
  .pill{flex:none;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:600}
  .pill.v{color:#7de8f8;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.3)}
  .pill.n{color:#c4b1fa;background:rgba(167,139,250,.10);border:1px solid rgba(167,139,250,.3)}
  .pill.r{color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777);border:1px solid transparent;
    box-shadow:0 2px 10px rgba(124,58,237,.45);letter-spacing:.5px}
  :root[data-theme="light"] .pill.r{color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777);
    box-shadow:0 3px 12px rgba(124,58,237,.38)}
  :root[data-theme="light"] .pill.v{color:#a21caf;background:rgba(219,39,119,.09);border-color:rgba(219,39,119,.26)}
  :root[data-theme="light"] .pill.n{color:#6d4de0;background:rgba(124,58,237,.09);border-color:rgba(124,58,237,.26)}
  .note{color:var(--sub);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .go-btn{flex:none;padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:700;
    letter-spacing:.5px;color:#7de8f8;background:rgba(34,211,238,.06);
    border:1px solid rgba(34,211,238,.45);
    text-shadow:0 0 8px rgba(34,211,238,.5);
    box-shadow:0 0 10px rgba(34,211,238,.15),inset 0 0 8px rgba(34,211,238,.08);
    transition:all .2s ease;white-space:nowrap}
  .item:hover .go-btn,.item:focus-visible .go-btn{
    color:#04121a;background:linear-gradient(90deg,#22d3ee,#67e8f9);
    border-color:transparent;text-shadow:none;
    box-shadow:0 0 18px rgba(34,211,238,.55);transform:translateX(2px)}
  :root[data-theme="light"] .go-btn{color:#6d4de0;background:rgba(124,58,237,.07);
    border-color:rgba(124,58,237,.38);text-shadow:none;box-shadow:none}
  :root[data-theme="light"] .item:hover .go-btn,
  :root[data-theme="light"] .item:focus-visible .go-btn{
    color:#fff;background:linear-gradient(90deg,#7c3aed,#a855f7);
    border-color:transparent;
    box-shadow:0 6px 18px rgba(124,58,237,.42)}

  /* ===== 页脚 ===== */
  footer{text-align:center;color:#565b80;font-size:12px;margin-top:56px;line-height:1.9}
  footer .heart{color:var(--pink)}
  :root[data-theme="light"] footer{color:rgba(255,255,255,.86)}

  /* ===== 主题切换 ===== */
  .theme-toggle{position:fixed;top:20px;right:20px;z-index:20;width:38px;height:38px;
    border-radius:12px;display:grid;place-items:center;cursor:pointer;
    color:#a9aed4;background:rgba(10,12,24,.55);border:1px solid var(--line);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:all .22s}
  .theme-toggle:hover{color:#7de8f8;border-color:rgba(34,211,238,.45);transform:translateY(-1px)}
  .theme-toggle:active{transform:scale(.94)}
  .theme-toggle svg{width:16px;height:16px;position:absolute;transition:opacity .3s,transform .4s}
  [data-theme="dark"] .icon-moon{opacity:0;transform:rotate(-35deg) scale(.7)}
  [data-theme="light"] .icon-sun{opacity:0;transform:rotate(35deg) scale(.7)}
  :root[data-theme="light"] .theme-toggle{background:rgba(255,255,255,.75);color:#5f648a}

  @media (max-width:640px){
    .pill.opt{display:none}
    header{padding-top:44px}
    h1{font-size:27px;letter-spacing:1px}
    .hico{width:40px;height:40px;border-radius:11px;font-size:18px}
    .sub{font-size:13px}
    .theme-toggle{top:14px;right:14px;width:34px;height:34px;border-radius:10px}
    .wrap{padding-bottom:64px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-delay:0ms !important;transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<!-- 背景层 -->
<div class="waves" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<div class="veil" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<!-- 主题切换 -->
<button class="theme-toggle" id="themeToggle" aria-label="切换亮色/暗色主题" title="切换亮色/暗色">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"></path>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 13.2A8.6 8.6 0 1 1 10.8 3.5a6.7 6.7 0 0 0 9.7 9.7z"></path>
  </svg>
</button>

<div class="wrap">

  <header>
    <div class="badge"><i></i><span data-slot="badge">资源站运行中</span></div>
    <h1><span class="hico" data-slot="brandIcon">盘</span><span data-slot="brand">盘搜资源库</span></h1>
    <div class="sub" data-slot="slogan">网盘资源 · 游戏 · 影视 · 软件 · DLC 一应俱全</div>
    <div class="meta"><span class="chip" data-slot="chip">资源均免费分享 · 无任何套路</span></div>
  </header>

  <nav id="list" aria-label="资源入口">

    <div class="sec"><span data-slot="group0">资源合集（每日更新）</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 13l6 6 6-6"></path></svg>
    </div>

    <div class="shakewrap">
    <a class="item" style="animation-delay:.02s" href="https://你的资源合集地址" target="_blank" rel="noopener">
      <span class="ava g0" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3l1.7 2h8.3A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path>
        </svg>
      </span>
      <span class="info">
        <span class="trow"><span class="title">盘搜影视站</span><span class="pill r">推荐</span><span class="pill v opt">每日更新</span></span>
        <span class="note">点此进入主目录</span>
      </span>
      <span class="go-btn">前往</span>
    </a>
    </div>

    <a class="item" style="animation-delay:.08s" href="https://你的游戏站地址" target="_blank" rel="noopener">
      <span class="ava g1" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.5 8h9A4.5 4.5 0 0 1 21 12.5v.6a3.9 3.9 0 0 1-6.9 2.5l-.6-.7H10.5l-.6.7A3.9 3.9 0 0 1 3 13.1v-.6A4.5 4.5 0 0 1 7.5 8z"></path>
          <path d="M8 11v2.4M6.8 12.2h2.4M15.6 11.6h.01M17.6 13.4h.01"></path>
        </svg>
      </span>
      <span class="info">
        <span class="trow"><span class="title">盘搜游戏站</span><span class="pill n">精选</span></span>
        <span class="note">精选游戏资源</span>
      </span>
      <span class="go-btn">前往</span>
    </a>

    <div class="sec" data-slot="group1">资源频道</div>

    <a class="item" style="animation-delay:.14s" href="https://你的粉丝群地址" target="_blank" rel="noopener">
      <span class="ava g3" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12.6c0 3.5-3.6 6.3-8 6.3a9.7 9.7 0 0 1-2.6-.35L5 20.5l.8-3.1A6 6 0 0 1 4 12.6C4 9.1 7.6 6.3 12 6.3s8 2.8 8 6.3z"></path>
          <path d="M9 12.4h.01M12 12.4h.01M15 12.4h.01"></path>
        </svg>
      </span>
      <span class="info">
        <span class="trow"><span class="title">企鹅粉丝群</span><span class="pill v">交流</span></span>
        <span class="note">资源更新 · 交流互助</span>
      </span>
      <span class="go-btn">前往</span>
    </a>

    <a class="item" style="animation-delay:.20s" href="https://你的网盘地址" target="_blank" rel="noopener">
      <span class="ava g2" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.9 18.4h9.9a3.7 3.7 0 0 0 .5-7.4 5.2 5.2 0 0 0-10-1.3 4.1 4.1 0 0 0-.4 8.7z"></path>
          <path d="M12 11.4v4.2M9.9 13.5 12 15.6l2.1-2.1"></path>
        </svg>
      </span>
      <span class="info">
        <span class="trow"><span class="title long">限时|网盘点此免费获得1TB容量</span></span>
        <span class="note">新用户专享 · 限时领取</span>
      </span>
      <span class="go-btn">前往</span>
    </a>

  </nav>

  <footer>
    <span class="heart">♥</span> <span data-slot="foot0">盘搜 · 资源合集站</span><br>
    <span data-slot="foot1">有问题请联系站长 · 请勿用于商业用途</span>
  </footer>

</div>

<script>
/* ============ 配置渲染：把 window.SITE 的文字写进页面 ============ */
(function () {
  var C = window.SITE;
  if (!C) return;

  function put(sel, txt) {
    if (txt == null) return;
    var el = document.querySelector(sel);
    if (el) el.textContent = txt;
  }

  if (C.title) document.title = C.title;
  put('[data-slot="badge"]',     C.badge);
  put('[data-slot="brandIcon"]', C.brandIcon);
  put('[data-slot="brand"]',     C.brand);
  put('[data-slot="slogan"]',    C.slogan);
  put('[data-slot="chip"]',      C.chip);
  put('[data-slot="foot0"]',     C.footer && C.footer[0]);
  put('[data-slot="foot1"]',     C.footer && C.footer[1]);

  if (C.groups) {
    for (var i = 0; i < C.groups.length; i++) {
      put('[data-slot="group' + i + '"]', C.groups[i]);
    }
  }

  var items = document.querySelectorAll('#list .item');
  if (C.cards) {
    for (var j = 0; j < items.length && j < C.cards.length; j++) {
      var el = items[j], c = C.cards[j];
      if (c.href) el.setAttribute('href', c.href);
      if (c.title) {
        el.setAttribute('aria-label', c.title);
        var t = el.querySelector('.title');
        if (t) t.textContent = c.title;
      }
      var n = el.querySelector('.note');
      if (n && c.note) n.textContent = c.note;

      if (c.tags) {
        var row = el.querySelector('.trow');
        if (row) {
          var old = row.querySelectorAll('.pill');
          for (var k = 0; k < old.length; k++) old[k].remove();
          for (var m = 0; m < c.tags.length; m++) {
            var s = document.createElement('span');
            s.className = 'pill ' + (c.tags[m].c || 'n');
            s.textContent = c.tags[m].t;
            row.appendChild(s);
          }
        }
      }
    }
  }

  if (C.go) {
    var btns = document.querySelectorAll('#list .go-btn');
    for (var b = 0; b < btns.length; b++) btns[b].textContent = C.go;
  }
})();
</script>

<script>
/* ============ 主题切换 ============ */
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');

  function apply(theme) {
    root.dataset.theme = theme;
    try { localStorage.setItem('link-theme-2', theme); } catch (e) {}
    btn.setAttribute('aria-label', theme === 'dark' ? '切换到亮色模式' : '切换到暗色模式');
  }

  btn.addEventListener('click', function () {
    apply(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });
})();
</script>

</body>
